# config.yaml
nano_llm:
  model_name: "microsoft/Phi-3-mini-4k-instruct-gguf"
  gguf_file: "Phi-3-mini-4k-instruct-q4.gguf" 
  max_length: 2048
  temperature: 0.7

rag:
  chunk_size: 800
  chunk_overlap: 100
  top_k: 5
  embedding_model: "all-MiniLM-L6-v2"

xai:
  explainer_type: "prompt_based" 

storage:
  chroma_path: "./vector_db"
  patient_data: "./data/sample_patient_data.json"

